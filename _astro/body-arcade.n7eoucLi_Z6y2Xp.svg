<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#1f1a32" />
      <stop offset="55%" stop-color="#0f0d17" />
      <stop offset="100%" stop-color="#08070d" />
    </radialGradient>

    <!-- Glow & Text Gradients -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffd166" />
      <stop offset="50%" stop-color="#ff8a3d" />
      <stop offset="100%" stop-color="#ff3b5c" />
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5ad1c4" />
      <stop offset="100%" stop-color="#2a8b81" />
    </linearGradient>

    <linearGradient id="cardGradFruit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d1525" />
      <stop offset="100%" stop-color="#190e18" />
    </linearGradient>

    <linearGradient id="cardGradDodge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#122a2c" />
      <stop offset="100%" stop-color="#0d1b1c" />
    </linearGradient>

    <linearGradient id="cardGradBox" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2f1e14" />
      <stop offset="100%" stop-color="#18110c" />
    </linearGradient>

    <filter id="neonGlowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="neonGlowOrange" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1280" height="720" fill="url(#bgGrad)" />

  <!-- Subtle Perspective Grid -->
  <g opacity="0.12" stroke="#5ad1c4" stroke-width="1">
    <line x1="0" y1="560" x2="1280" y2="560" />
    <line x1="0" y1="610" x2="1280" y2="610" />
    <line x1="0" y1="655" x2="1280" y2="655" />
    <line x1="0" y1="692" x2="1280" y2="692" />
    <line x1="0" y1="718" x2="1280" y2="718" />
    <!-- Vanishing rays -->
    <line x1="640" y1="460" x2="-100" y2="720" />
    <line x1="640" y1="460" x2="120" y2="720" />
    <line x1="640" y1="460" x2="340" y2="720" />
    <line x1="640" y1="460" x2="520" y2="720" />
    <line x1="640" y1="460" x2="760" y2="720" />
    <line x1="640" y1="460" x2="940" y2="720" />
    <line x1="640" y1="460" x2="1160" y2="720" />
    <line x1="640" y1="460" x2="1380" y2="720" />
  </g>

  <!-- Top Status Bar & Tech Badges -->
  <g transform="translate(60, 42)">
    <!-- Live Webcam Detection Pill -->
    <rect width="210" height="34" rx="17" fill="#1b1826" stroke="#34304d" stroke-width="1.2" />
    <circle cx="20" cy="17" r="5" fill="#5ad1c4" filter="url(#neonGlowCyan)">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="36" y="22" font-family="'DM Sans', system-ui, sans-serif" font-size="13" font-weight="700" fill="#f6f1e7" letter-spacing="0.04em">WEBCAM POSE READY</text>

    <!-- Center Category Pill -->
    <g transform="translate(420, 0)">
      <rect width="280" height="34" rx="17" fill="rgba(255, 138, 61, 0.12)" stroke="#ff8a3d" stroke-width="1" />
      <text x="140" y="22" text-anchor="middle" font-family="'DM Sans', system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffd166" letter-spacing="0.1em">VISION-BASED MOTION GAMING</text>
    </g>

    <!-- MediaPipe Badge -->
    <g transform="translate(940, 0)">
      <rect width="220" height="34" rx="17" fill="#1b1826" stroke="#34304d" stroke-width="1.2" />
      <text x="110" y="22" text-anchor="middle" font-family="'DM Sans', system-ui, sans-serif" font-size="12" font-weight="600" fill="#a9a3b8">MediaPipe WASM • 60 FPS</text>
    </g>
  </g>

  <!-- Human Pose Skeleton Visualization (The Camera Vision Feedback) -->
  <g transform="translate(640, 240)" opacity="0.85">
    <!-- Glow aura -->
    <circle cx="0" cy="-60" r="28" fill="none" stroke="#5ad1c4" stroke-width="3" filter="url(#neonGlowCyan)" />
    <circle cx="0" cy="-60" r="10" fill="#5ad1c4" />
    <!-- Torso -->
    <line x1="-36" y1="-20" x2="36" y2="-20" stroke="#5ad1c4" stroke-width="3" />
    <line x1="-36" y1="-20" x2="-22" y2="70" stroke="#5ad1c4" stroke-width="2.5" />
    <line x1="36" y1="-20" x2="22" y2="70" stroke="#5ad1c4" stroke-width="2.5" />
    <line x1="-22" y1="70" x2="22" y2="70" stroke="#5ad1c4" stroke-width="2.5" />
    <line x1="0" y1="-32" x2="0" y2="70" stroke="rgba(90, 209, 196, 0.4)" stroke-width="1.5" stroke-dasharray="4,4" />
    
    <!-- Left Arm (Dynamic Swing) -->
    <line x1="-36" y1="-20" x2="-80" y2="-55" stroke="#5ad1c4" stroke-width="3" />
    <line x1="-80" y1="-55" x2="-125" y2="-100" stroke="#ff8a3d" stroke-width="3.5" filter="url(#neonGlowOrange)" />
    <circle cx="-125" cy="-100" r="12" fill="#ff8a3d" />
    <!-- Swipe Trail Arc -->
    <path d="M -160 -40 Q -150 -115 -100 -125" fill="none" stroke="#ffd166" stroke-width="4" stroke-linecap="round" opacity="0.75" />

    <!-- Right Arm (Guard Pose) -->
    <line x1="36" y1="-20" x2="75" y2="-40" stroke="#5ad1c4" stroke-width="3" />
    <line x1="75" y1="-40" x2="110" y2="-85" stroke="#5ad1c4" stroke-width="3" />
    <circle cx="110" cy="-85" r="9" fill="#5ad1c4" />

    <!-- Joint Landmarks -->
    <circle cx="-36" cy="-20" r="5" fill="#ffffff" />
    <circle cx="36" cy="-20" r="5" fill="#ffffff" />
    <circle cx="-80" cy="-55" r="5" fill="#ffffff" />
    <circle cx="75" cy="-40" r="5" fill="#ffffff" />
    <circle cx="-22" cy="70" r="5" fill="#ffffff" />
    <circle cx="22" cy="70" r="5" fill="#ffffff" />
  </g>

  <!-- Main Arcade Title -->
  <g transform="translate(640, 215)">
    <text x="0" y="0" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-size="82" font-weight="900" fill="url(#titleGrad)" letter-spacing="4px" filter="url(#dropShadow)">BODY ARCADE</text>
    <text x="0" y="42" text-anchor="middle" font-family="'DM Sans', system-ui, sans-serif" font-size="18" font-weight="600" fill="#a9a3b8" letter-spacing="0.05em">
      Interactive motion games played through your webcam — No hardware controller required
    </text>
  </g>

  <!-- 3 Game Mode Cards -->
  <g transform="translate(140, 360)">
    <!-- Game 1: Fruit Slash -->
    <g transform="translate(0, 0)" filter="url(#dropShadow)">
      <rect width="300" height="230" rx="20" fill="url(#cardGradFruit)" stroke="#ff3b5c" stroke-width="2" />
      <circle cx="150" cy="65" r="38" fill="rgba(255, 59, 92, 0.15)" stroke="#ff3b5c" stroke-width="1.5" />
      <text x="150" y="78" text-anchor="middle" font-size="36">🍉</text>
      <text x="150" y="130" text-anchor="middle" font-family="'Impact', sans-serif" font-size="24" fill="#f6f1e7" letter-spacing="1.5px">FRUIT SLASH</text>
      <text x="150" y="156" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="13" fill="#a9a3b8">Slash fruits with hand trails</text>
      <text x="150" y="174" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="13" fill="#a9a3b8">Combos • Bombs • Slow-Mo</text>
      <rect x="75" y="190" width="150" height="26" rx="13" fill="#ff3b5c" opacity="0.25" />
      <text x="150" y="207" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="11" font-weight="700" fill="#ff758f">MOTION TRAIL SLICING</text>
    </g>

    <!-- Game 2: Dodge & Duck -->
    <g transform="translate(350, 0)" filter="url(#dropShadow)">
      <rect width="300" height="230" rx="20" fill="url(#cardGradDodge)" stroke="#5ad1c4" stroke-width="2" />
      <circle cx="150" cy="65" r="38" fill="rgba(90, 209, 196, 0.15)" stroke="#5ad1c4" stroke-width="1.5" />
      <text x="150" y="78" text-anchor="middle" font-size="36">🧱</text>
      <text x="150" y="130" text-anchor="middle" font-family="'Impact', sans-serif" font-size="24" fill="#f6f1e7" letter-spacing="1.5px">DODGE &amp; DUCK</text>
      <text x="150" y="156" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="13" fill="#a9a3b8">Full body obstacle evasion</text>
      <text x="150" y="174" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="13" fill="#a9a3b8">Duck • Lean • Jump • Step</text>
      <rect x="70" y="190" width="160" height="26" rx="13" fill="#5ad1c4" opacity="0.25" />
      <text x="150" y="207" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="11" font-weight="700" fill="#5ad1c4">CALIBRATED POSTURE</text>
    </g>

    <!-- Game 3: Boxing Knockout -->
    <g transform="translate(700, 0)" filter="url(#dropShadow)">
      <rect width="300" height="230" rx="20" fill="url(#cardGradBox)" stroke="#ff8a3d" stroke-width="2" />
      <circle cx="150" cy="65" r="38" fill="rgba(255, 138, 61, 0.15)" stroke="#ff8a3d" stroke-width="1.5" />
      <text x="150" y="78" text-anchor="middle" font-size="36">🥊</text>
      <text x="150" y="130" text-anchor="middle" font-family="'Impact', sans-serif" font-size="24" fill="#f6f1e7" letter-spacing="1.5px">BOXING: KNOCKOUT</text>
      <text x="150" y="156" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="13" fill="#a9a3b8">Punches • Blocks • AI Rivals</text>
      <text x="150" y="174" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="13" fill="#a9a3b8">3D Depth • Audio Synthesizer</text>
      <rect x="75" y="190" width="150" height="26" rx="13" fill="#ff8a3d" opacity="0.25" />
      <text x="150" y="207" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="11" font-weight="700" fill="#ffaa66">DEPTH-PUNCH TRACKING</text>
    </g>
  </g>

  <!-- Bottom Interactive Cue / Button Preview -->
  <g transform="translate(640, 642)">
    <rect x="-140" y="-22" width="280" height="44" rx="22" fill="#ff8a3d" filter="url(#neonGlowOrange)" />
    <text x="0" y="6" text-anchor="middle" font-family="'DM Sans', system-ui, sans-serif" font-size="15" font-weight="800" fill="#1b1208" letter-spacing="0.08em">
      ▶ PLAY IN BROWSER NOW
    </text>
  </g>
</svg>