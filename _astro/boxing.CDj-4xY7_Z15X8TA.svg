<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%">
  <defs>
    <!-- Background Arena Radial Gradient -->
    <radialGradient id="arenaGrad" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#21182d" />
      <stop offset="50%" stop-color="#120e1d" />
      <stop offset="100%" stop-color="#08060c" />
    </radialGradient>

    <!-- Ring Spotlight Gradient -->
    <radialGradient id="spotlight" cx="50%" cy="30%" r="55%">
      <stop offset="0%" stop-color="rgba(255, 138, 61, 0.18)" />
      <stop offset="70%" stop-color="rgba(255, 59, 92, 0.05)" />
      <stop offset="100%" stop-color="rgba(0,0,0,0)" />
    </radialGradient>

    <linearGradient id="youHealth" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2fb3a5" />
      <stop offset="70%" stop-color="#5ad1c4" />
      <stop offset="100%" stop-color="#b8fff6" />
    </linearGradient>

    <linearGradient id="foeHealth" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ff3b5c" />
      <stop offset="70%" stop-color="#ff8a3d" />
      <stop offset="100%" stop-color="#ffd166" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#arenaGrad)" />
  <rect width="1280" height="720" fill="url(#spotlight)" />

  <!-- Ring Ropes & Stage Perspective -->
  <g opacity="0.25" stroke="#ff8a3d" stroke-width="2">
    <line x1="0" y1="280" x2="1280" y2="280" />
    <line x1="0" y1="360" x2="1280" y2="360" />
    <line x1="0" y1="440" x2="1280" y2="440" />
  </g>

  <!-- HUD: Top Header -->
  <g transform="translate(60, 36)">
    <!-- Player Bar: YOU -->
    <g transform="translate(0, 0)">
      <text x="0" y="20" font-family="'Impact', sans-serif" font-size="24" fill="#f6f1e7" letter-spacing="1px">YOU</text>
      <!-- Health Bar -->
      <rect x="0" y="32" width="400" height="22" rx="11" fill="#1b1826" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" />
      <rect x="2" y="34" width="340" height="18" rx="9" fill="url(#youHealth)" />
      <text x="12" y="48" font-family="'DM Sans', sans-serif" font-size="11" font-weight="800" fill="#0f0d17">STAMINA 85%</text>
    </g>

    <!-- Center Match Status -->
    <g transform="translate(580, 0)">
      <text x="0" y="14" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="14" font-weight="800" fill="#a9a3b8" letter-spacing="2px">ROUND 1</text>
      <text x="0" y="52" text-anchor="middle" font-family="'Impact', sans-serif" font-size="44" fill="#ffd166" letter-spacing="2px">1,840</text>
      <text x="0" y="74" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="13" font-weight="700" fill="#a9a3b8">BEST 5,200</text>
    </g>

    <!-- Opponent Bar: SLUGGER -->
    <g transform="translate(760, 0)">
      <text x="400" y="20" text-anchor="end" font-family="'Impact', sans-serif" font-size="24" fill="#ff5d73" letter-spacing="1px">
        <tspan fill="#ff3b5c" font-size="14" font-family="'DM Sans', sans-serif" font-weight="800" letter-spacing="1.5px">BOSS </tspan>
        SLUGGER
      </text>
      <!-- Health Bar -->
      <rect x="0" y="32" width="400" height="22" rx="11" fill="#1b1826" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" />
      <rect x="180" y="34" width="218" height="18" rx="9" fill="url(#foeHealth)" />
      <text x="388" y="48" text-anchor="end" font-family="'DM Sans', sans-serif" font-size="11" font-weight="800" fill="#0f0d17">HP 54%</text>
    </g>
  </g>

  <!-- Opponent Character (Silhouette & Target Zones) -->
  <g transform="translate(640, 360)">
    <!-- Opponent Silhouette -->
    <ellipse cx="0" cy="-90" rx="42" ry="50" fill="#2d1c3a" stroke="#ff3b5c" stroke-width="2.5" />
    <path d="M -80 0 Q -70 -70 0 -70 Q 70 -70 80 0 Q 75 140 0 160 Q -75 140 -80 0 Z" fill="#22162e" stroke="#ff3b5c" stroke-width="2" />
    <!-- Opponent Gloves Up -->
    <circle cx="-95" cy="-40" r="32" fill="#ff3b5c" opacity="0.8" />
    <circle cx="95" cy="-40" r="32" fill="#ff3b5c" opacity="0.8" />

    <!-- Open Target Hitbox (Vulnerable Spot) -->
    <circle cx="45" cy="-20" r="28" fill="none" stroke="#ffd166" stroke-width="3" stroke-dasharray="6,4" filter="url(#glow)">
      <animate attributeName="r" values="24;32;24" dur="1s" repeatCount="indefinite" />
    </circle>
    <text x="45" y="-14" text-anchor="middle" font-family="'Impact', sans-serif" font-size="18" fill="#ffd166">HIT!</text>

    <!-- Impact Spark Flash -->
    <g transform="translate(-40, -80)">
      <circle cx="0" cy="0" r="25" fill="#ffffff" filter="url(#glow)" opacity="0.9" />
      <polygon points="0,-45 10,-12 45,-5 14,10 25,45 -5,16 -40,30 -14,-5" fill="#ffd166" />
      <text x="0" y="8" text-anchor="middle" font-family="'Impact', sans-serif" font-size="28" fill="#ff3b5c" font-weight="900">WHAM!</text>
    </g>
  </g>

  <!-- Player Hands / Tracking Gloves (Foreground) -->
  <g transform="translate(640, 520)">
    <!-- Left Hand: Straight Punch extending forward -->
    <g transform="translate(-160, -90)">
      <circle cx="0" cy="0" r="48" fill="#5ad1c4" opacity="0.85" filter="url(#glow)" />
      <circle cx="0" cy="0" r="40" fill="#2fb3a5" />
      <circle cx="0" cy="0" r="14" fill="#ffffff" />
      <!-- Speed Ring -->
      <circle cx="0" cy="0" r="62" fill="none" stroke="#5ad1c4" stroke-width="2" stroke-dasharray="4,6" opacity="0.6" />
      <text x="0" y="80" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="13" font-weight="800" fill="#5ad1c4">SPEED: 1.4x (HIGH)</text>
    </g>

    <!-- Right Hand: Guard Position -->
    <g transform="translate(180, 20)">
      <circle cx="0" cy="0" r="42" fill="#ff8a3d" opacity="0.85" filter="url(#glow)" />
      <circle cx="0" cy="0" r="34" fill="#d96b20" />
      <circle cx="0" cy="0" r="12" fill="#ffffff" />
      <text x="0" y="65" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="13" font-weight="800" fill="#ff8a3d">RIGHT FIST</text>
    </g>
  </g>

  <!-- Combo Meter Floating Pill -->
  <g transform="translate(160, 480)">
    <rect width="180" height="60" rx="14" fill="rgba(15,13,23,0.85)" stroke="#ffd166" stroke-width="2" filter="url(#glow)" />
    <text x="90" y="32" text-anchor="middle" font-family="'Impact', sans-serif" font-size="26" fill="#ffd166" letter-spacing="1px">4x COMBO</text>
    <text x="90" y="50" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="11" font-weight="700" fill="#a9a3b8">COUNTER WINDOW</text>
  </g>

  <!-- Technical Overlay Tag -->
  <g transform="translate(640, 675)">
    <rect x="-240" y="-16" width="480" height="32" rx="16" fill="rgba(15, 13, 23, 0.9)" stroke="#34304d" stroke-width="1.2" />
    <text x="0" y="5" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="13" font-weight="600" fill="#a9a3b8">
      Real-Time 3D Punch Velocity • Head Slip &amp; Guard Detection • Procedural Sound FX
    </text>
  </g>
</svg>