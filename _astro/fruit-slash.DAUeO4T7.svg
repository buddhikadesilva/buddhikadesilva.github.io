<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%">
  <defs>
    <radialGradient id="fsBg" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#231728" />
      <stop offset="60%" stop-color="#110d18" />
      <stop offset="100%" stop-color="#09070d" />
    </radialGradient>

    <linearGradient id="bladeTrail" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 209, 102, 0)" />
      <stop offset="40%" stop-color="#ffd166" />
      <stop offset="85%" stop-color="#ff3b5c" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>

    <filter id="fsGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#fsBg)" />

  <!-- Top HUD -->
  <g transform="translate(60, 40)">
    <!-- Score & Best -->
    <g transform="translate(0, 0)">
      <text x="0" y="44" font-family="'Impact', sans-serif" font-size="52" fill="#f6f1e7" letter-spacing="2px">4,250</text>
      <text x="0" y="68" font-family="'DM Sans', sans-serif" font-size="14" font-weight="700" fill="#a9a3b8" letter-spacing="1px">BEST 7,890</text>
    </g>

    <!-- Lives & Active Powers -->
    <g transform="translate(1160, 0)">
      <text x="0" y="32" text-anchor="end" font-size="28" letter-spacing="4px">❤️❤️❤️</text>
      <!-- Powerup Tag -->
      <g transform="translate(0, 48)">
        <rect x="-140" y="-12" width="140" height="28" rx="14" fill="rgba(127, 216, 255, 0.2)" stroke="#7fd8ff" stroke-width="1.2" />
        <text x="-70" y="6" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="12" font-weight="800" fill="#7fd8ff">❄️ SLOW-MO (4s)</text>
      </g>
    </g>
  </g>

  <!-- Sliced Watermelon Splatter (Center) -->
  <g transform="translate(620, 320)">
    <!-- Juice Splatter Drops -->
    <circle cx="-60" cy="-40" r="14" fill="#ff3b5c" opacity="0.8" />
    <circle cx="-110" cy="20" r="8" fill="#ff3b5c" opacity="0.7" />
    <circle cx="90" cy="-50" r="12" fill="#ff3b5c" opacity="0.8" />
    <circle cx="130" cy="40" r="9" fill="#ff3b5c" opacity="0.6" />
    <circle cx="-30" cy="80" r="10" fill="#ff3b5c" opacity="0.7" />

    <!-- Left Half Slice -->
    <g transform="translate(-75, -20) rotate(-25)">
      <path d="M -70 0 A 70 70 0 0 0 70 0 Z" fill="#2d6a4f" />
      <path d="M -64 0 A 64 64 0 0 0 64 0 Z" fill="#d8f3dc" />
      <path d="M -58 0 A 58 58 0 0 0 58 0 Z" fill="#ff3b5c" />
      <!-- Seeds -->
      <circle cx="-25" cy="25" r="3" fill="#1b1208" />
      <circle cx="0" cy="35" r="3" fill="#1b1208" />
      <circle cx="25" cy="25" r="3" fill="#1b1208" />
    </g>

    <!-- Right Half Slice -->
    <g transform="translate(75, 40) rotate(35)">
      <path d="M -70 0 A 70 70 0 0 0 70 0 Z" fill="#2d6a4f" />
      <path d="M -64 0 A 64 64 0 0 0 64 0 Z" fill="#d8f3dc" />
      <path d="M -58 0 A 58 58 0 0 0 58 0 Z" fill="#ff3b5c" />
      <!-- Seeds -->
      <circle cx="-25" cy="25" r="3" fill="#1b1208" />
      <circle cx="0" cy="35" r="3" fill="#1b1208" />
      <circle cx="25" cy="25" r="3" fill="#1b1208" />
    </g>

    <!-- Floating Combo Indicator -->
    <g transform="translate(0, -90)">
      <rect x="-80" y="-18" width="160" height="36" rx="18" fill="rgba(255, 209, 102, 0.25)" stroke="#ffd166" stroke-width="1.5" filter="url(#fsGlow)" />
      <text x="0" y="6" text-anchor="middle" font-family="'Impact', sans-serif" font-size="20" fill="#ffd166" letter-spacing="1.5px">+250 COMBO! 🔥</text>
    </g>
  </g>

  <!-- Other Floating Targets -->
  <!-- Orange -->
  <g transform="translate(240, 420)">
    <circle cx="0" cy="0" r="44" fill="#ff9f1c" />
    <circle cx="0" cy="0" r="38" fill="#ffb703" />
    <circle cx="0" cy="0" r="6" fill="#ffffff" opacity="0.6" />
    <text x="0" y="62" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="12" font-weight="700" fill="#ffd166">+100</text>
  </g>

  <!-- Bomb (Hazard to Avoid) -->
  <g transform="translate(980, 260)">
    <circle cx="0" cy="0" r="42" fill="#1e1b2e" stroke="#ff3b5c" stroke-width="2.5" />
    <text x="0" y="16" text-anchor="middle" font-size="44">💣</text>
    <!-- Warning Ring -->
    <circle cx="0" cy="0" r="54" fill="none" stroke="#ff3b5c" stroke-width="2" stroke-dasharray="4,6" opacity="0.8">
      <animate attributeName="stroke-dashoffset" values="0;20" dur="1s" repeatCount="indefinite" />
    </circle>
    <text x="0" y="76" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="12" font-weight="800" fill="#ff3b5c">AVOID!</text>
  </g>

  <!-- Powerup (Freeze Snowflake) -->
  <g transform="translate(380, 220)">
    <circle cx="0" cy="0" r="36" fill="rgba(127, 216, 255, 0.2)" stroke="#7fd8ff" stroke-width="2" filter="url(#fsGlow)" />
    <text x="0" y="14" text-anchor="middle" font-size="36">❄️</text>
  </g>

  <!-- Glowing Hand Slash Blade Arc (Dynamic Motion Trails) -->
  <path d="M 280 580 Q 560 380 920 180" fill="none" stroke="url(#bladeTrail)" stroke-width="8" stroke-linecap="round" filter="url(#fsGlow)" />
  <path d="M 320 570 Q 580 390 910 190" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.9" />

  <!-- Player Hand Tracker Endpoint -->
  <g transform="translate(920, 180)">
    <circle cx="0" cy="0" r="16" fill="#ffffff" filter="url(#fsGlow)" />
    <circle cx="0" cy="0" r="28" fill="none" stroke="#ffd166" stroke-width="2.5" />
    <text x="38" y="6" font-family="'DM Sans', sans-serif" font-size="13" font-weight="800" fill="#ffd166">RIGHT WRIST</text>
  </g>

  <!-- Bottom Info -->
  <g transform="translate(640, 675)">
    <rect x="-240" y="-16" width="480" height="32" rx="16" fill="rgba(15, 13, 23, 0.9)" stroke="#34304d" stroke-width="1.2" />
    <text x="0" y="5" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="13" font-weight="600" fill="#a9a3b8">
      Real-Time Optical Flow &amp; Wrist Motion Trails • HTML5 2D Canvas • Multi-Fruit Splatters
    </text>
  </g>
</svg>