<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Body Arcade — Boxing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=DM+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f0d17;--ink:#f6f1e7;--muted:#a9a3b8;--accent:#ff8a3d;--teal:#5ad1c4;--red:#ff3b5c;--line:rgba(255,255,255,.14)}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"DM Sans",system-ui,sans-serif;overflow:hidden}
canvas{position:fixed;inset:0;width:100vw;height:100vh;display:block;touch-action:none}
video{display:none}
.hud{position:fixed;top:0;left:0;right:0;display:grid;grid-template-columns:1fr auto 1fr;gap:clamp(10px,2vw,24px);align-items:start;padding:14px 18px;pointer-events:none}
.fighter .name{font-family:Bungee,sans-serif;font-size:clamp(13px,2vw,22px);line-height:1.1;margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 3px 0 rgba(0,0,0,.4)}
.fighter.foe{text-align:right}
.tag{display:inline-block;font-family:"DM Sans",sans-serif;font-weight:800;font-size:.6em;letter-spacing:.12em;background:var(--red);color:#fff;border-radius:999px;padding:2px 8px;vertical-align:middle;margin-right:6px}
.bar{position:relative;height:clamp(14px,2.2vw,22px);border-radius:999px;background:rgba(15,13,23,.75);border:1px solid var(--line);overflow:hidden}
.bar i{position:absolute;top:0;bottom:0;width:100%}
.bar .chip{background:#fff;opacity:.5;transition:width .5s ease .3s}
.bar .fill{transition:width .12s}
.you .bar i{left:0}
.you .fill{background:linear-gradient(90deg,#2fb3a5,#5ad1c4 70%,#b8fff6)}
.foe .bar i{right:0}
.foe .fill{background:linear-gradient(270deg,#ff3b5c,#ff8a3d 70%,#ffd166)}
.bar.low .fill{animation:pulse .5s ease-in-out infinite alternate}
@keyframes pulse{to{opacity:.45}}
.mid{text-align:center}
.round{font-weight:800;font-size:13px;letter-spacing:.14em;color:var(--muted)}
.score{font-family:Bungee,sans-serif;font-size:clamp(30px,5vw,56px);line-height:1;text-shadow:0 4px 0 rgba(0,0,0,.35)}
.best{font-size:13px;color:var(--muted);margin-top:4px;font-weight:700;letter-spacing:.06em}
.overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:8vh 16px 0;text-align:center;pointer-events:none;gap:10px}
.title{font-family:Bungee,sans-serif;font-size:clamp(44px,9vw,104px);line-height:.92;margin:0;background:linear-gradient(180deg,#ffd166,#ff8a3d 55%,#ff3b5c);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 6px 0 rgba(0,0,0,.4))}
.sub{color:var(--muted);max-width:54ch;margin:0;font-size:16px}
.controls{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;pointer-events:auto;margin-top:6px}
button,select{font:inherit;font-weight:700;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.07);color:var(--ink);padding:10px 18px;cursor:pointer;max-width:100%}
button.primary{background:var(--accent);border-color:var(--accent);color:#1b1208}
select{background:#1b1826}
.status{font-size:13px;color:var(--muted)}
.hint{position:fixed;bottom:4vh;left:16px;right:16px;text-align:center;font-weight:700;font-size:clamp(15px,2.2vw,22px);pointer-events:none;text-shadow:0 2px 10px rgba(0,0,0,.8)}
.big{font-family:Bungee,sans-serif;font-size:clamp(30px,5.5vw,60px);margin:0;color:#ff5d73;text-shadow:0 5px 0 rgba(0,0,0,.4)}
.newbest{color:#ffd166;font-weight:800;letter-spacing:.1em}
#banner{justify-content:center;padding:0 16px 12vh}
.bn-big{font-family:Bungee,sans-serif;font-size:clamp(48px,11vw,130px);line-height:.95;margin:0;color:var(--ink);text-shadow:0 7px 0 rgba(0,0,0,.45)}
.bn-big.hot{background:linear-gradient(180deg,#ffd166,#ff8a3d 55%,#ff3b5c);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;filter:drop-shadow(0 7px 0 rgba(0,0,0,.45))}
.bn-sub{font-family:Bungee,sans-serif;font-size:clamp(18px,3vw,32px);margin:0;text-shadow:0 3px 0 rgba(0,0,0,.4)}
.bn-tip{color:var(--muted);font-weight:700;max-width:46ch;margin:0;text-shadow:0 2px 8px rgba(0,0,0,.8)}

/* Super meter & controls */
.top-controls{position:fixed;top:14px;right:18px;display:flex;gap:10px;align-items:center;z-index:90;pointer-events:auto}
.mute-btn{background:rgba(15,13,23,.75);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:16px;cursor:pointer;color:var(--ink);transition:transform .1s}
.mute-btn:hover{transform:scale(1.08)}
.track-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(15,13,23,.75);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:12px;font-weight:700;color:var(--muted)}
.track-badge .dot{width:8px;height:8px;border-radius:50%;background:#5ad1c4;animation:pulseDot 1.5s infinite}
@keyframes pulseDot{0%,100%{opacity:1}50%{opacity:.3}}
.super-wrap{margin-top:6px;display:flex;flex-direction:column;gap:4px}
.super-bar{position:relative;height:8px;border-radius:999px;background:rgba(255,255,255,.1);overflow:hidden;border:1px solid rgba(255,209,102,.3);transition:box-shadow .3s}
.super-fill{position:absolute;top:0;left:0;bottom:0;width:0%;background:linear-gradient(90deg,#ff8a3d,#ffd166);transition:width .15s}
.super-bar.ready{box-shadow:0 0 12px #ffd166;border-color:#ffd166}
.super-bar.ready .super-fill{background:linear-gradient(90deg,#ff5d3d,#ffd166 60%,#ffffff);animation:superGlow .8s infinite alternate}
@keyframes superGlow{from{opacity:.8}to{opacity:1;filter:brightness(1.3)}}
.super-btn{font-family:Bungee,sans-serif;font-size:clamp(11px,1.6vw,14px);background:linear-gradient(180deg,#ffd166,#ff8a3d);border:none;border-radius:999px;color:#1b1208;padding:4px 12px;cursor:pointer;margin-top:2px;box-shadow:0 0 16px rgba(255,138,61,.7);animation:pulseBtn .9s infinite alternate;pointer-events:auto;letter-spacing:.05em}
@keyframes pulseBtn{from{transform:scale(1)}to{transform:scale(1.06)}}
</style>
</head>
<body>
<video id="v" playsinline muted></video>
<canvas id="c"></canvas>

<div class="hud" id="hud" hidden>
  <div class="fighter you"><div class="name">YOU</div><div class="bar" id="youBar"><i class="chip"></i><i class="fill"></i></div></div>
  <div class="mid"><div class="round" id="roundHud">ROUND 1</div><div class="score" id="score">0</div><div class="best" id="bestHud">BEST 0</div></div>
  <div class="fighter foe"><div class="name" id="foeName">—</div><div class="bar" id="foeBar"><i class="chip"></i><i class="fill"></i></div></div>
</div>

<div class="overlay" id="menu">
  <h1 class="title">KNOCK<br>OUT</h1>
  <p class="sub">Box your way up the ladder. Punch the spots your opponent leaves open, raise your fists to block, and counter when they stumble. Every third fight is a boss.</p>
  <div class="controls">
    <button class="primary" id="camBtn">Start camera</button>
    <select id="cam" hidden></select>
    <button id="mouseBtn">Play with mouse</button>
    <a href="index.html" class="btn-nav">🕹️ Body Arcade</a>
  </div>
  <div class="status" id="status">Loading pose model…</div>
</div>

<div class="overlay" id="banner" hidden>
  <p class="bn-sub" id="bnTop"></p>
  <p class="bn-big" id="bnBig"></p>
  <p class="bn-sub" id="bnSub"></p>
  <p class="bn-tip" id="bnTip"></p>
</div>

<div class="overlay" id="over" hidden>
  <p class="big">KNOCKED OUT</p>
  <div class="score" id="finalScore">0</div>
  <div class="newbest" id="newBest" hidden>NEW BEST!</div>
  <p class="sub" id="overStats"></p>
</div>

<div class="hint" id="hint"></div>

<script type="module">
const VISION = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";
const WASM = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm";
const MODEL = "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task";

const $ = id => document.getElementById(id);
const video = $("v"), canvas = $("c"), ctx = canvas.getContext("2d");
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;

/* ---------- sizing ---------- */
let W = 0, H = 0, DPR = 1, U = 1, vignette = null, dangerGrad = null;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 1.5);
  W = canvas.width = Math.round(innerWidth * DPR);
  H = canvas.height = Math.round(innerHeight * DPR);
  U = Math.min(H, W * 0.9) / 100;
  vignette = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.35, W / 2, H / 2, Math.max(W, H) * 0.75);
  vignette.addColorStop(0, "rgba(0,0,0,0)"); vignette.addColorStop(1, "rgba(0,0,0,.65)");
  dangerGrad = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * .3, W / 2, H / 2, Math.max(W, H) * .7);
  dangerGrad.addColorStop(0, "rgba(255,40,60,0)"); dangerGrad.addColorStop(1, "rgba(255,40,60,.45)");
}
addEventListener("resize", resize); resize();

/* ---------- content ---------- */
// The ladder loops; each lap adds a tier of speed and toughness. Every third fighter is a boss.
const FIGHTERS = [
  { name: "Rookie Rex",   skin: "#e0a77a", color: "#3d8bff", glove: "#ff4d4d", hair: "band",    hairC: "#3d8bff" },
  { name: "Iron Ivy",     skin: "#c68642", color: "#9b5de5", glove: "#ffd166", hair: "bun",     hairC: "#2a1a12" },
  { name: "Big Brick",    skin: "#b5715a", color: "#ff3b5c", glove: "#3a3a46", hair: "bald",    boss: true, beard: true },
  { name: "Lefty Lou",    skin: "#f1c27d", color: "#2ec4b6", glove: "#ff8a3d", hair: "mohawk",  hairC: "#ff3b5c" },
  { name: "Viper Vee",    skin: "#8d5524", color: "#c3f584", glove: "#5ad1c4", hair: "band",    hairC: "#c3f584" },
  { name: "The Mountain", skin: "#a86b4c", color: "#ffd166", glove: "#ff3b5c", hair: "mohawk",  hairC: "#1b1208", boss: true, beard: true },
];
const EMOJI_FONT = '"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif';

/* ---------- storage ---------- */
const getBest = () => { try { return +localStorage.getItem("boxing-best") || 0; } catch { return 0; } };
const setBest = v => { try { localStorage.setItem("boxing-best", v); } catch {} };

/* ---------- sound system ---------- */
let actx = null, noiseBuf = null, masterGain = null, soundMuted = false;
try { soundMuted = localStorage.getItem("boxing-muted") === "1"; } catch {}

function ac() {
  if (!actx) {
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (AudioCtx) actx = new AudioCtx();
  }
  if (actx && actx.state === "suspended") {
    actx.resume();
  }
  return actx;
}

// Global user gesture unlock
['click', 'keydown', 'touchstart', 'pointerdown'].forEach(evt => {
  window.addEventListener(evt, () => {
    if (actx && actx.state === "suspended") actx.resume();
  }, { passive: true });
});

function getMaster(a) {
  if (!masterGain) {
    masterGain = a.createGain();
    masterGain.gain.setValueAtTime(soundMuted ? 0 : 0.85, a.currentTime);
    const comp = a.createDynamicsCompressor();
    comp.threshold.setValueAtTime(-14, a.currentTime);
    comp.knee.setValueAtTime(24, a.currentTime);
    comp.ratio.setValueAtTime(8, a.currentTime);
    comp.attack.setValueAtTime(0.003, a.currentTime);
    comp.release.setValueAtTime(0.12, a.currentTime);
    masterGain.connect(comp).connect(a.destination);
  }
  return masterGain;
}

function tone(f, d, type = "sine", vol = 0.28, slide = 0, pan = 0) {
  try {
    const a = ac();
    if (!a) return;
    const t = a.currentTime, o = a.createOscillator(), g = a.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(25, f * slide), t + d);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + d);

    if (a.createStereoPanner) {
      const p = a.createStereoPanner();
      p.pan.setValueAtTime(clamp(pan, -0.9, 0.9), t);
      o.connect(g).connect(p).connect(getMaster(a));
    } else {
      o.connect(g).connect(getMaster(a));
    }
    o.start(t);
    o.stop(t + d + 0.02);
  } catch {}
}

function noise(d, f0, f1, vol = 0.35, type = "bandpass", pan = 0) {
  try {
    const a = ac();
    if (!a) return;
    const t = a.currentTime;
    if (!noiseBuf || noiseBuf.sampleRate !== a.sampleRate) {
      noiseBuf = a.createBuffer(1, a.sampleRate * 2, a.sampleRate);
      const ch = noiseBuf.getChannelData(0);
      for (let i = 0; i < ch.length; i++) ch[i] = Math.random() * 2 - 1;
    }
    const s = a.createBufferSource();
    s.buffer = noiseBuf;
    s.loop = true;
    const fl = a.createBiquadFilter();
    fl.type = type;
    fl.Q.value = 1.3;
    fl.frequency.setValueAtTime(f0, t);
    fl.frequency.exponentialRampToValueAtTime(Math.max(30, f1), t + d);
    const g = a.createGain();
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + d);

    if (a.createStereoPanner) {
      const p = a.createStereoPanner();
      p.pan.setValueAtTime(clamp(pan, -0.9, 0.9), t);
      s.connect(fl).connect(g).connect(p).connect(getMaster(a));
    } else {
      s.connect(fl).connect(g).connect(getMaster(a));
    }
    s.start(t);
    s.stop(t + d);
  } catch {}
}

const later = (ms, fn) => setTimeout(fn, ms);

const sfx = {
  // Super move power ready chime
  superReady: () => {
    ac();
    [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => {
      later(i * 70, () => tone(f, 0.22, "triangle", 0.32));
    });
  },
  // Devastating Meteor Punch explosion + crowd roar
  meteorPunch: (x = W / 2) => {
    ac();
    const pan = clamp((x / (W || 1)) * 2 - 1, -0.85, 0.85);
    noise(0.6, 2800, 40, 0.95, "lowpass", pan);
    tone(65, 0.7, "sawtooth", 0.85, 0.2, pan);
    tone(40, 0.9, "sine", 0.9, 0.1, pan);
    later(100, () => sfx.crowdCheer(true));
  },
  // Procedural dynamic crowd stadium reaction
  crowdCheer: (huge = false) => {
    ac();
    const dur = huge ? 2.5 : 1.2;
    noise(dur, 600, 1800, huge ? 0.45 : 0.25, "bandpass");
    noise(dur * 0.8, 250, 900, huge ? 0.35 : 0.18, "lowpass");
  },
  crowdGasp: () => {
    ac();
    noise(0.5, 300, 1200, 0.3, "bandpass");
  },
  // Heavy sub-bass KO boom
  deepBoom: () => {
    ac();
    tone(55, 0.85, "sine", 0.75, 0.2);
    noise(0.45, 400, 30, 0.65, "lowpass");
  },
  // High punch (face hit): sharp slap + heavy low punch bass
  hit: (n, high) => {
    ac();
    noise(0.12, high ? 2400 : 1200, 180, 0.65, "lowpass");
    tone(high ? 190 : 130, 0.16, "sine", 0.45, 0.4);
    tone(high ? 360 : 220, 0.09, "triangle", 0.3, 0.5);
    if (n >= 3) {
      later(40, () => tone(620 + Math.min(n, 10) * 70, 0.12, "square", 0.18));
    }
  },
  // Counter punch: massive electric punch with extra damage tone
  counter: () => {
    ac();
    noise(0.22, 3000, 100, 0.75, "lowpass");
    tone(95, 0.4, "sawtooth", 0.5, 0.3);
    tone(60, 0.5, "sine", 0.6, 0.2);
    [880, 1320].forEach((f, i) => later(i * 60, () => tone(f, 0.16, "square", 0.25)));
  },
  // Punch caught on guard: heavy leather block
  guarded: () => {
    ac();
    noise(0.09, 2800, 1100, 0.4, "bandpass");
    tone(240, 0.08, "triangle", 0.28, 0.6);
  },
  // Opponent windup / attack telegraph
  windup: k => {
    ac();
    noise(k, 250, 1600, 0.2, "bandpass");
    tone(130, k, "sawtooth", 0.18, 1.8);
  },
  // Air whoosh on punch swing
  whoosh: () => {
    ac();
    noise(0.14, 600, 2800, 0.3, "bandpass");
    tone(180, 0.08, "sine", 0.2, 0.4);
  },
  // Player gets hit
  hurt: () => {
    ac();
    noise(0.38, 900, 50, 0.75, "lowpass");
    tone(75, 0.5, "sine", 0.6, 0.3);
    tone(160, 0.25, "sawtooth", 0.35, 0.3);
  },
  // Blocked opponent swing
  block: () => {
    ac();
    noise(0.11, 2000, 450, 0.45, "lowpass");
    tone(220, 0.1, "triangle", 0.32, 0.6);
  },
  // Perfect parry / counter window opening
  perfect: () => {
    ac();
    noise(0.12, 2200, 500, 0.4, "lowpass");
    [659, 830, 988, 1318].forEach((f, i) => later(i * 45, () => tone(f, 0.14, "triangle", 0.28)));
  },
  // Dazed opponent
  dazed: () => {
    ac();
    [980, 880, 780, 680, 580].forEach((f, i) => later(i * 65, () => tone(f, 0.12, "sine", 0.22)));
  },
  // Authentic boxing ring bell
  bell: (n = 1) => {
    ac();
    for (let i = 0; i < n; i++) {
      later(i * 350, () => {
        tone(1250, 1.6, "sine", 0.45);
        tone(2680, 1.1, "sine", 0.22);
        tone(3900, 0.7, "sine", 0.12);
        noise(0.08, 4500, 1800, 0.25, "bandpass");
      });
    }
  },
  // Knockout victory
  ko: () => {
    ac();
    noise(1.8, 500, 3500, 0.4, "bandpass");
    [261, 329, 392, 523, 659].forEach((f, i) => later(180 + i * 110, () => tone(f, 0.25, "triangle", 0.35)));
  },
  // Target start pad hit
  pad: n => {
    ac();
    noise(0.12, 1200, 200, 0.55, "lowpass");
    tone(160 + n * 45, 0.14, "sine", 0.4, 0.6);
  },
  // Game over
  over: () => {
    ac();
    [392, 349, 311, 261].forEach((f, i) => later(i * 150, () => tone(f, 0.3, "triangle", 0.3, 0.85)));
  },
};

/* ---------- game state ---------- */
const G = {
  mode: "menu", input: null, clock: 0, phaseT: 0, round: 0, score: 0, php: 100, foe: null,
  parts: [], texts: [], rings: [], stars: [], shake: 0, flash: 0, flashColor: "#fff", danger: 0,
  combo: 0, comboT: -9, bestCombo: 0, kos: 0, lastPose: -9, roundT: 0,
  guard: false, guardSince: -9, guardOffT: 0, keyGuard: false, mouseGuard: false,
  face: null, shoulderY: null, pads: [],
  super: 0, superReady: false, timeScale: 1.0, koZoom: 0,
};

/* ---------- player hands ---------- */
const mkHand = color => ({ color, x: 0, y: 0, z: 0, has: false, lastSeen: -1e9, hist: [], lastPunch: -1e9, pop: 0 });
const hands = [mkHand("#5ad1c4"), mkHand("#ff8a3d")];
const pointer = { x: 0, y: 0, has: false, pop: 0 };
const PUNCH_SPEED = () => 62 * U; // px per second, screen motion plus forward (depth) motion

// sx,sy is the matching shoulder: a punch moves the fist away from it (or toward the camera), a retraction pulls it back
function moveHand(h, x, y, z, sx, sy, now) {
  if (!h.has || now - h.lastSeen > 300) { h.hist = []; h.x = x; h.y = y; h.z = z; }
  else { h.x += (x - h.x) * .7; h.y += (y - h.y) * .7; h.z += (z - h.z) * .5; }
  h.has = true; h.lastSeen = now;
  const ext = Math.hypot(h.x - sx, h.y - sy) - h.z * VID.dw * .6;
  h.hist.push({ x: h.x, y: h.y, ext, t: now });
  while (h.hist.length > 2 && now - h.hist[0].t > 100) h.hist.shift();

/* 1-Euro Filter for silky-smooth punch tracking */
class LowPassFilter {
  constructor(alpha = 0.5) { this.setAlpha(alpha); this.y = null; this.s = null; }
  setAlpha(alpha) { this.alpha = Math.max(0, Math.min(1, alpha)); }
  filter(val, alpha = this.alpha) {
    if (this.y === null) { this.s = val; this.y = val; return val; }
    this.y = alpha * val + (1 - alpha) * this.s;
    this.s = this.y;
    return this.y;
  }
  last() { return this.y; }
  reset() { this.y = null; this.s = null; }
}

class OneEuroFilter {
  constructor(freq = 60, minCutoff = 1.2, beta = 0.012, dCutoff = 1.0) {
    this.freq = freq; this.minCutoff = minCutoff; this.beta = beta; this.dCutoff = dCutoff;
    this.xFilter = new LowPassFilter();
    this.dxFilter = new LowPassFilter();
    this.lastTime = null;
  }
  alpha(cutoff, dt) {
    const tau = 1.0 / (2 * Math.PI * cutoff);
    return 1.0 / (1.0 + tau / dt);
  }
  filter(x, timestamp = performance.now() / 1000) {
    if (this.lastTime === null) { this.lastTime = timestamp; return this.xFilter.filter(x); }
    const dt = Math.max(timestamp - this.lastTime, 1e-4);
    this.lastTime = timestamp;
    const prevX = this.xFilter.last() ?? x;
    const dx = (x - prevX) / dt;
    const edx = this.dxFilter.filter(dx, this.alpha(this.dCutoff, dt));
    const cutoff = this.minCutoff + this.beta * Math.abs(edx);
    return this.xFilter.filter(x, this.alpha(cutoff, dt));
  }
  reset() { this.xFilter.reset(); this.dxFilter.reset(); this.lastTime = null; }
}

const euroHands = [
  { x: new OneEuroFilter(60, 1.2, 0.015), y: new OneEuroFilter(60, 1.2, 0.015), z: new OneEuroFilter(60, 1.0, 0.01) },
  { x: new OneEuroFilter(60, 1.2, 0.015), y: new OneEuroFilter(60, 1.2, 0.015), z: new OneEuroFilter(60, 1.0, 0.01) },

function addImpactStar(x, y, r, points = 8, innerR = r * 0.45, c = "#ffd166") {
  G.stars.push({ x, y, r, points, innerR, c, life: 0.22, max: 0.22 });

function drawStar(x, y, r, points, innerR, color, alpha = 1) {
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.fillStyle = color;
  ctx.shadowColor = color;
  ctx.shadowBlur = 12 * U;
  ctx.beginPath();
  for (let i = 0; i < points * 2; i++) {
    const radius = i % 2 === 0 ? r : innerR;
    const angle = (i * Math.PI) / points - Math.PI / 2;
    const sx = x + Math.cos(angle) * radius;
    const sy = y + Math.sin(angle) * radius;
    if (i === 0) ctx.moveTo(sx, sy); else ctx.lineTo(sx, sy);
  }
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

/* ---------- opponent ---------- */
function makeFoe(round) {
  const def = FIGHTERS[round % FIGHTERS.length], tier = Math.floor(round / FIGHTERS.length), r = round;
  const boss = !!def.boss, hp = Math.round((90 + 22 * r) * (boss ? 1.6 : 1));
  return {
    def, boss, tier, hp, max: hp, k: boss ? 1.22 : 1,
    windup: Math.max(.42, .95 - .055 * r), dmg: 9 + 1.6 * r, gap: Math.max(.95, 2.5 - .14 * r),
    state: "idle", st: 0, next: 1.6, guard: "none", guardT: 1.5, atk: null,
    gl: [{ x: W / 2, y: H / 2, s: 1 }, { x: W / 2, y: H / 2, s: 1 }],

// Where the opponent stands this frame; every hit test and drawing call uses it
function foeFrame(e) {

  const cy = H * .55 + Math.sin(G.clock * 3.2) * .8 * U + e.bodyHit * 2 * U;
  return { u, cx, cy, hx: cx + e.recX * u, hy: cy - 21 * u + e.recY * u };

function setFoeState(e, s, dur = 0) { e.state = s; e.st = 0; e.stateDur = dur; }
function pickGuard(e) {
  const r = G.round;
  const opts = r === 0 ? [["none", .55], ["high", .45]] : [["none", .3], ["high", .4], ["low", .3]];
  let x = Math.random() * opts.reduce((s, o) => s + o[1], 0);

function startAttack(e) {

  const type = pick(types), side = Math.random() < .5 ? -1 : 1;

    hook:     { windup: e.windup * 1.3, dmg: e.dmg * 1.5, hits: 1 },
    flurry:   { windup: e.windup,       dmg: e.dmg * .7,  hits: 3 },
    haymaker: { windup: e.windup * 1.9, dmg: e.dmg * 2.6, hits: 1 },
  }[type];
  e.atk = { type, side, ...A, left: A.hits };
  e.guard = e.boss ? "high" : "none";
  setFoeState(e, "windup", A.windup);
  sfx.windup(Math.min(.6, A.windup));
  if (type === "haymaker") addText(W / 2, H * .2, "BIG ONE — BLOCK!", "#ff5d73", 5, A.windup);

function strikeTarget() {

function resolveStrike(e) {

    burst(t.x, t.y, perfect ? "#ffd166" : "#5ad1c4", perfect ? 26 : 14, 1.1);

/* ---------- punching ---------- */
function punch(level, power, x, y) {
  if (G.mode === "menu" || G.mode === "over") return hitPad(x, y);
  if (G.mode !== "fight") return;
  const e = G.foe;
  if (!e || e.state === "ko") return;
  const f = foeFrame(e), u = f.u;
  const px = level === "high" ? f.hx + rand(-3, 3) * u : f.cx + rand(-6, 6) * u;
  const py = level === "high" ? f.hy + rand(-2, 3) * u : f.cy + rand(0, 8) * u;
  sfx.whoosh();
  if (e.guard === level) {
    addText(px, py - 8 * u, "GUARDED", "#a9a3b8", 3.2, .6);
    burst(px, py, "#d8d3e6", 8, .6); sfx.guarded();
    e.recY = level === "high" ? -.6 : 0;
    return;
  }
  const counter = e.state === "off", dazed = e.state === "dazed";
  let dmg = (level === "high" ? 7 : 5) * power * (counter ? 2 : dazed ? 1.5 : 1);
  dmg *= e.tier ? 1 + e.tier * .15 : 1;
  if (G.clock - G.comboT > 1.2) G.combo = 0;
  G.combo++; G.comboT = G.clock; G.bestCombo = Math.max(G.bestCombo, G.combo);
  e.hp = Math.max(0, e.hp - dmg);
  const pts = Math.round(dmg * 10 * (1 + .1 * Math.min(G.combo, 10)));
  G.score += pts;
  e.flash = 1; e.hurtFace = .35;
  if (level === "high") { e.recX = rand(-1, 1) * 3; e.recY = -3; } else { e.bodyHit = 1; e.recY = 1.2; }
  burst(px, py, counter ? "#ffd166" : "#ffffff", counter ? 26 : 14, counter ? 1.4 : 1);
  burst(px, py, "#bfe8ff", 6, .5, "drop"); // sweat
  ring(px, py, counter ? "#ffd166" : "#ffffff", counter ? 16 : 10);
  addText(px, py - 9 * u, "+" + pts, counter ? "#ffd166" : "#ffffff", counter ? 4.5 : 3.2, .7);
  if (counter) { addText(W / 2, H * .22, "COUNTER!", "#ffd166", 6.5, .9); sfx.counter(); G.shake = Math.max(G.shake, 2.5 * U); }
  else { sfx.hit(G.combo, level === "high"); G.shake = Math.max(G.shake, .9 * U); }

  if (G.clock - e.zone.t > 2) e.zone = { high: 0, low: 0, t: G.clock };

    setFoeState(e, "dazed", e.boss ? 1.2 : 1.6); e.guard = "none"; e.atk = null;
    addText(f.hx, f.hy - 14 * u, "DAZED!", "#c3f584", 5.5, 1.1); sfx.dazed();

/* ---------- start pad (menu / game over) ---------- */

function spawnPads(label, withMenu) {

function hitPad(x, y, p) {

/* ---------- update ---------- */
function updateFoe(e, dt) {

    ctx.globalCompositeOperation = p.type === "spark" ? "lighter" : "source-over";
    ctx.globalAlpha = p.type === "smoke" ? a * .35 : a;
    ctx.fillStyle = p.c; ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalCompositeOperation = "source-over"; ctx.globalAlpha = 1;

  // floating text
  ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.lineJoin = "round";
  for (const t of G.texts) {
    const age = t.max - t.life, k = Math.min(1, .4 + age * 7);
    ctx.globalAlpha = Math.min(1, t.life * 2.5);
    ctx.font = `${t.size * U * k}px Bungee, ${EMOJI_FONT}`;
    ctx.lineWidth = .9 * U; ctx.strokeStyle = "rgba(0,0,0,.7)"; ctx.strokeText(t.s, t.x, t.y);
    ctx.fillStyle = t.c; ctx.fillText(t.s, t.x, t.y);
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  drawPlayer(now);

  if (G.danger > .02) {
    ctx.globalAlpha = G.danger; ctx.fillStyle = dangerGrad; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1;
  }
  if (G.flash > 0) { ctx.globalAlpha = G.flash * .6; ctx.fillStyle = G.flashColor; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
}

/* ---------- pose ---------- */
let landmarker = null, stream = null, lastVT = -1, autoPicked = false;
async function loadModel() {
  const { PoseLandmarker, FilesetResolver } = await import(VISION);
  const files = await FilesetResolver.forVisionTasks(WASM);
  const opts = d => ({ baseOptions: { modelAssetPath: MODEL, delegate: d }, runningMode: "VIDEO", numPoses: 1 });
  try { landmarker = await PoseLandmarker.createFromOptions(files, opts("GPU")); }
  catch { landmarker = await PoseLandmarker.createFromOptions(files, opts("CPU")); }
  $("status").textContent = "Pose model ready.";
}
loadModel().catch(e => { $("status").textContent = "Couldn't load the pose model — mouse mode still works. (" + e.message + ")"; });

function handlePose(lm, now) {
  if (!lm) return;
  G.lastPose = G.clock;
  const P = i => ({ x: W - (VID.ox + lm[i].x * VID.dw), y: VID.oy + lm[i].y * VID.dh, z: lm[i].z, v: lm[i].visibility ?? 1 });
  const nose = P(0), ls = P(11), rs = P(12), lw = P(15), rw = P(16);
  const sw = Math.max(8 * U, Math.hypot(ls.x - rs.x, ls.y - rs.y)), sy = (ls.y + rs.y) / 2;
  G.face = { x: nose.x, y: nose.y }; G.shoulderY = sy; G.shoulderW = sw;

  // Update tracking health badge
  const tb = $("trackBadge"), tt = $("trackText");
  if (tb && tt) {
    tb.hidden = false;
    const good = nose.v > 0.6 && lw.v > 0.5 && rw.v > 0.5;
    tt.textContent = good ? "Tracking Good" : "Lighting Low / Stand Back";
    tb.querySelector(".dot").style.background = good ? "#5ad1c4" : "#ff8a3d";
  }

  // guard: both fists up by the face
  const up = w => w.v > .4 && w.y < sy + sw * .1 && w.y > nose.y - sw * .9 && Math.abs(w.x - nose.x) < sw * .8;
  if (up(lw) && up(rw)) { if (!G.guard) G.guardSince = G.clock; G.guard = true; G.guardOffT = .15; }

  for (const [w, ix, sh, bi] of [[15, 19, 11, 0], [16, 20, 12, 1]]) {
    const a = P(w), b = P(ix), s = P(sh);
    if (a.v < .4) continue;
    const rx = a.x + (b.x - a.x) * .9, ry = a.y + (b.y - a.y) * .9;
    const sx = euroHands[bi].x.filter(rx, now / 1000);
    const sy = euroHands[bi].y.filter(ry, now / 1000);
    const sz = euroHands[bi].z.filter(a.z, now / 1000);
    moveHand(hands[bi], sx, sy, sz, s.x, s.y, now);
  }

  // Dual-fist Meteor punch detection in camera mode
  if (G.superReady && G.mode === "fight" && !G.guard) {
    const h0 = hands[0], h1 = hands[1];
    if (h0.has && h1.has && now - h0.lastPunch < 180 && now - h1.lastPunch < 180) {
      unleashMeteorPunch();
    }
  }
}

/* ---------- camera ---------- */
async function startCamera(deviceId) {
  ac();
  if (stream) stream.getTracks().forEach(t => t.stop());
  const size = { width: { ideal: 1280 }, height: { ideal: 720 } };
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: deviceId ? { deviceId: { exact: deviceId }, ...size } : size, audio: false });
  } catch (e) {
    if (deviceId) return startCamera(); // saved camera unplugged or renamed: use the default one
    $("status").textContent = "Camera blocked or not found. Allow camera access in your browser and try again. (" + e.name + ")";
    return;
  }
  video.srcObject = stream; await video.play();
  G.input = "camera"; $("camBtn").textContent = "Restart camera";
  if (deviceId) autoPicked = true; // a camera the player chose beats the Osmo auto-pick
  if (G.mode === "menu") spawnPads("PUNCH TO START");
  await listCameras(stream.getVideoTracks()[0].getSettings().deviceId);
}
async function listCameras(currentId) {
  const cams = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === "videoinput");
  const sel = $("cam"); sel.innerHTML = "";
  cams.forEach((c, i) => {
    const o = document.createElement("option");
    o.value = c.deviceId; o.textContent = c.label || `Camera ${i + 1}`; o.selected = c.deviceId === currentId;
    sel.appendChild(o);
  });
  sel.hidden = cams.length < 2;
  if (!autoPicked) {
    autoPicked = true;
    const osmo = cams.find(c => /osmo|pocket/i.test(c.label));
    if (osmo && osmo.deviceId !== currentId) await startCamera(osmo.deviceId);
  }
}
// the menu (index.html) stores the chosen camera under this key; all games share it
const saveCam = id => { try { localStorage.setItem("body-arcade-camera", id); } catch {} };
const savedCam = () => { try { return localStorage.getItem("body-arcade-camera"); } catch { return null; } };

// Sound mute button toggle
const soundBtn = $("soundBtn");
if (soundBtn) {
  soundBtn.textContent = soundMuted ? "🔇" : "🔊";
  soundBtn.onclick = () => {
    soundMuted = !soundMuted;
    try { localStorage.setItem("boxing-muted", soundMuted ? "1" : "0"); } catch {}
    soundBtn.textContent = soundMuted ? "🔇" : "🔊";
    if (masterGain && actx) {
      masterGain.gain.setValueAtTime(soundMuted ? 0 : 0.85, actx.currentTime);
    }
  };
}

// Super button click
const superBtn = $("superBtn");
if (superBtn) {
  superBtn.onclick = e => {
    e.stopPropagation();
    unleashMeteorPunch();
  };
}
$("camBtn").onclick = () => startCamera(savedCam());
$("cam").onchange = e => { saveCam(e.target.value); startCamera(e.target.value); };
$("mouseBtn").onclick = e => {
  e.currentTarget.blur(); // so Space / Enter go to the game, not the button
  ac(); G.input = G.input || "mouse";
  if (G.mode === "menu") spawnPads("PUNCH TO START");
};

// Auto-start in mouse mode if launched with ?input=mouse
const urlInput = new URLSearchParams(location.search).get("input");
if (urlInput === "mouse") {
  G.input = "mouse";
  if (G.mode === "menu") spawnPads("PUNCH TO START");
}

/* ---------- mouse / keyboard fallback ---------- */
const mouseLevel = y => {
  const e = G.foe; if (!e) return "high";
  const f = foeFrame(e);
  return y < f.hy + 6 * f.u ? "high" : "low";
};
let lastClick = -1e9;
addEventListener("pointermove", e => { pointer.x = e.clientX * DPR; pointer.y = e.clientY * DPR; pointer.has = true; });
addEventListener("pointerdown", e => {
  if (!G.input || e.target.closest("button,select")) return;
  ac();
  if (G.input === "camera") { // still let a click start the game from the pad
    const x = e.clientX * DPR, y = e.clientY * DPR;
    const p = G.pads.find(p => { const q = padPos(p); return Math.hypot(x - q.x, y - q.y) < q.r * 1.5; });
    if (p) { p.hits = p.need - 1; hitPad(x, y, p); }
    return;
  }
  const x = e.clientX * DPR, y = e.clientY * DPR;
  pointer.x = x; pointer.y = y; pointer.has = true;
  if (e.button === 2) { G.mouseGuard = true; return; }
  if (e.button !== 0 || G.guard || performance.now() - lastClick < 170) return;
  lastClick = performance.now(); pointer.pop = 1;
  punch(mouseLevel(y), 1.15, x, y);
});
addEventListener("pointerup", e => { if (e.button === 2) G.mouseGuard = false; });
addEventListener("contextmenu", e => e.preventDefault());
addEventListener("blur", () => { G.keyGuard = G.mouseGuard = false; });
addEventListener("keydown", e => {
  if (e.code === "Space" && G.superReady && G.mode === "fight") { e.preventDefault(); unleashMeteorPunch(); return; }
  if (e.code === "Space" || e.code === "ShiftLeft" || e.code === "ShiftRight") {
    e.preventDefault(); if (G.input && G.input !== "camera") G.keyGuard = true;
  }
  if (e.repeat) return;
  if (e.code === "Escape") return goMenu();
  if (e.code === "Enter" && G.pads.length) { e.preventDefault(); ac(); const p = G.pads[0]; p.hits = p.need - 1; p.born = -9; hitPad(0, 0, p); }
  if ((e.code === "KeyJ" || e.code === "KeyK") && G.input && G.input !== "camera" && !G.guard && G.foe && performance.now() - lastClick > 170) {
    ac(); lastClick = performance.now(); const f = foeFrame(G.foe), high = e.code === "KeyJ";
    pointer.pop = 1; punch(high ? "high" : "low", 1.15, f.cx, high ? f.hy : f.cy);
  }
});
addEventListener("keyup", e => {
  if (e.code === "Space" || e.code === "ShiftLeft" || e.code === "ShiftRight") G.keyGuard = false;
});

/* ---------- main loop ---------- */
let last = performance.now();
function frame(now) {
  const rdt = clamp((now - last) / 1000, 0, .05); last = now; G.clock += rdt;
  if (landmarker && G.input === "camera" && video.readyState >= 2 && video.currentTime !== lastVT) {
    lastVT = video.currentTime;
    try { handlePose(landmarker.detectForVideo(video, now).landmarks?.[0], now); } catch {}
  }

  // Smooth decay for KO zoom and timeScale
  if (G.timeScale < 1) G.timeScale = Math.min(1, G.timeScale + rdt * 1.4);
  if (G.koZoom > 0) G.koZoom = Math.max(0, G.koZoom - rdt * 0.7);

  // Update impact stars
  for (let i = G.stars.length - 1; i >= 0; i--) {
    G.stars[i].life -= rdt;
    if (G.stars[i].life <= 0) G.stars.splice(i, 1);
  }

  update(rdt * G.timeScale, rdt);
  draw(now);
  requestAnimationFrame(frame);
}
updateHud();
requestAnimationFrame(frame);
</script>
