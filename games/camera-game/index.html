<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Body Arcade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=DM+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f0d17;--ink:#f6f1e7;--muted:#a9a3b8;--accent:#ff8a3d;--teal:#5ad1c4;--line:rgba(255,255,255,.14)}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"DM Sans",system-ui,sans-serif;overflow:hidden}
canvas{position:fixed;inset:0;width:100vw;height:100vh;display:block;touch-action:none}
video{display:none}
.hud{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;padding:14px 18px;pointer-events:none}
.score{font-family:Bungee,sans-serif;font-size:clamp(34px,6vw,64px);line-height:1;text-shadow:0 4px 0 rgba(0,0,0,.35)}
.best{font-size:14px;color:var(--muted);margin-top:6px;font-weight:700;letter-spacing:.06em}
.right{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.lives{font-size:clamp(22px,3.4vw,34px);letter-spacing:4px}
.powers{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.pw{display:flex;align-items:center;gap:8px;background:rgba(15,13,23,.75);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-weight:700;font-size:14px}
.pw i{display:block;width:56px;height:5px;border-radius:9px;background:rgba(255,255,255,.15);overflow:hidden}
.pw i b{display:block;height:100%}
.overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:7vh 16px 0;text-align:center;pointer-events:none;gap:10px}
.title{font-family:Bungee,sans-serif;font-size:clamp(40px,8vw,96px);line-height:.92;margin:0;background:linear-gradient(180deg,#ffd166,#ff8a3d 55%,#ff3b5c);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 6px 0 rgba(0,0,0,.4))}
.sub{color:var(--muted);max-width:56ch;margin:0;font-size:16px}
.controls{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;pointer-events:auto;margin-top:6px}
button,select{font:inherit;font-weight:700;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.07);color:var(--ink);padding:10px 18px;cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:#1b1208}
select{background:#1b1826}
.status{font-size:13px;color:var(--muted)}
.hint{position:fixed;bottom:4vh;left:16px;right:16px;text-align:center;font-weight:700;font-size:clamp(15px,2.2vw,22px);pointer-events:none;text-shadow:0 2px 10px rgba(0,0,0,.8)}
.big{font-family:Bungee,sans-serif;font-size:clamp(30px,5.5vw,60px);margin:0;color:#ff5d73;text-shadow:0 5px 0 rgba(0,0,0,.4)}
.newbest{color:#ffd166;font-weight:800;letter-spacing:.1em}
</style>
</head>
<body>
<video id="v" playsinline muted></video>
<canvas id="c"></canvas>

<div class="hud" id="hud" hidden>
  <div><div class="score" id="score">0</div><div class="best" id="bestHud">BEST 0</div></div>
  <div class="right"><div class="lives" id="lives"></div><div class="powers" id="powers"></div></div>
</div>

<div class="overlay" id="menu">
  <h1 class="title">BODY<br>ARCADE</h1>
  <p class="sub" id="menuSub">Games you play with your whole body. Start the camera, then swing a hand through a game to play it.</p>
  <div class="controls">
    <button class="primary" id="camBtn">Start camera</button>
    <select id="cam" hidden></select>
    <button id="mouseBtn">Play with mouse</button>
  </div>
  <div class="status" id="status">Loading pose model…</div>
</div>

<div class="overlay" id="over" hidden>
  <p class="big">GAME OVER</p>
  <div class="score" id="finalScore">0</div>
  <div class="newbest" id="newBest" hidden>NEW BEST!</div>
  <p class="sub" id="overStats"></p>
</div>

<div class="hint" id="hint"></div>

<script type="module">
const VISION = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";
const WASM = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm";
const MODEL = "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task";

const $ = id => document.getElementById(id);
const video = $("v"), canvas = $("c"), ctx = canvas.getContext("2d");
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

/* ---------- sizing ---------- */
let W = 0, H = 0, DPR = 1, U = 1, vignette = null;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 1.5);
  W = canvas.width = Math.round(innerWidth * DPR);
  H = canvas.height = Math.round(innerHeight * DPR);
  U = Math.min(H, W * 0.9) / 100;
  vignette = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.35, W / 2, H / 2, Math.max(W, H) * 0.75);
  vignette.addColorStop(0, "rgba(0,0,0,0)"); vignette.addColorStop(1, "rgba(0,0,0,.65)");
}
addEventListener("resize", resize); resize();
const GRAV = () => H * 1.15;

/* ---------- games ---------- */
// Games in this file run in place; games with a page open that page.
const GAMES = [
  { id: "fruit", name: "FRUIT SLASH", e: "🍉", c: "#ff3b5c", key: "fruit-slash-best", page: "fruit-slash.html" },
  { id: "dodge", name: "DODGE & DUCK", e: "🧱", c: "#5ad1c4", key: "dodge-duck-best" },
  { id: "boxing", name: "BOXING", e: "🥊", c: "#ff8a3d", key: "boxing-best", page: "boxing.html" },
];
const gameDef = id => GAMES.find(g => g.id === id);

/* ---------- content ---------- */
const FRUITS = [
  { e:"🍉", c:"#ff3b5c", s:1.25 }, { e:"🍊", c:"#ff9f1c", s:1 },   { e:"🍎", c:"#ff4d4d", s:1 },
  { e:"🍋", c:"#fff35c", s:.95 },  { e:"🍓", c:"#ff2d55", s:.85 },  { e:"🥝", c:"#9ccc65", s:.9 },
  { e:"🍑", c:"#ffb38a", s:1 },    { e:"🍍", c:"#ffd23f", s:1.2 },  { e:"🥭", c:"#ffb000", s:1 },
  { e:"🍇", c:"#9b5de5", s:1.05 }, { e:"🥥", c:"#f2efe9", s:1.05 }, { e:"🍌", c:"#ffe14d", s:1.1 },
];
const BOMB = { e:"💣", c:"#ff5d3d", s:1.05 };
const POWERS = {
  freeze: { e:"❄️", c:"#7fd8ff", label:"Slow-mo",   dur:6 },
  double: { e:"⭐", c:"#ffd166", label:"2× points", dur:8 },
  frenzy: { e:"🌪️", c:"#c3f584", label:"Frenzy!",   dur:5 },
  life:   { e:"❤️", c:"#ff5d73", label:"+1 life",   dur:0 },
};

const EMOJI_FONT = '"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif';
const sprites = {};
function sprite(e) {
  if (sprites[e]) return sprites[e];
  const s = document.createElement("canvas"); s.width = s.height = 192;
  const g = s.getContext("2d");
  g.font = `150px ${EMOJI_FONT}`; g.textAlign = "center"; g.textBaseline = "middle";
  g.fillText(e, 96, 104);
  return sprites[e] = s;
}
const drawSprite = (e, r) => ctx.drawImage(sprite(e), -r * 1.28, -r * 1.28, r * 2.56, r * 2.56);

/* ---------- storage ---------- */
const getBest = (id = G.game) => { try { return +localStorage.getItem(gameDef(id)?.key) || 0; } catch { return 0; } };
const setBest = v => { try { localStorage.setItem(gameDef(G.game).key, v); } catch {} };
const saveCam = id => { try { localStorage.setItem("body-arcade-camera", id); } catch {} };
const savedCam = () => { try { return localStorage.getItem("body-arcade-camera"); } catch { return null; } };

/* ---------- sound system ---------- */
let actx = null, noiseBuf = null, masterGain = null, lastLaunchSfx = 0, lastWhooshSfx = 0;

function ac() {
  if (!actx) {
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (AudioCtx) actx = new AudioCtx();
  }
  if (actx && actx.state === "suspended") {
    actx.resume();
  }
  return actx;
}

// Global user gesture unlock
['click', 'keydown', 'touchstart', 'pointerdown'].forEach(evt => {
  window.addEventListener(evt, () => {
    if (actx && actx.state === "suspended") actx.resume();
  }, { passive: true });
});

function getMaster(a) {
  if (!masterGain) {
    masterGain = a.createGain();
    masterGain.gain.setValueAtTime(0.85, a.currentTime);
    const comp = a.createDynamicsCompressor();
    comp.threshold.setValueAtTime(-14, a.currentTime);
    comp.knee.setValueAtTime(24, a.currentTime);
    comp.ratio.setValueAtTime(8, a.currentTime);
    comp.attack.setValueAtTime(0.003, a.currentTime);
    comp.release.setValueAtTime(0.12, a.currentTime);
    masterGain.connect(comp).connect(a.destination);
  }
  return masterGain;
}

function tone(f, d, type = "sine", vol = 0.28, slide = 0) {
  try {
    const a = ac();
    if (!a) return;
    const t = a.currentTime, o = a.createOscillator(), g = a.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(25, f * slide), t + d);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g).connect(getMaster(a));
    o.start(t);
    o.stop(t + d + 0.02);
  } catch {}
}

function noise(d, f0, f1, vol = 0.35, type = "bandpass") {
  try {
    const a = ac();
    if (!a) return;
    const t = a.currentTime;
    if (!noiseBuf || noiseBuf.sampleRate !== a.sampleRate) {
      noiseBuf = a.createBuffer(1, a.sampleRate * 2, a.sampleRate);
      const ch = noiseBuf.getChannelData(0);
      for (let i = 0; i < ch.length; i++) ch[i] = Math.random() * 2 - 1;
    }
    const s = a.createBufferSource();
    s.buffer = noiseBuf;
    s.loop = true;
    const fl = a.createBiquadFilter();
    fl.type = type;
    fl.Q.value = 1.3;
    fl.frequency.setValueAtTime(f0, t);
    fl.frequency.exponentialRampToValueAtTime(Math.max(30, f1), t + d);
    const g = a.createGain();
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    s.connect(fl).connect(g).connect(getMaster(a));
    s.start(t);
    s.stop(t + d);
  } catch {}
}

const later = (ms, fn) => setTimeout(fn, ms);

const sfx = {
  // Fruit slicing sound: air slash + snappy juicy cut
  slice: n => {
    ac();
    noise(0.12, 6000, 1500, 0.45, "bandpass");
    tone(460 + Math.min(n, 12) * 80, 0.12, "triangle", 0.32, 1.8);
    tone(180, 0.08, "sine", 0.35, 0.4);
    if (n >= 3) {
      later(40, () => tone(880 + Math.min(n, 8) * 110, 0.15, "sine", 0.25));
    }
  },
  // Whoosh when hands swing through the air fast
  whoosh: (spd = 1) => {
    const t = performance.now();
    if (t - lastWhooshSfx > 130) {
      lastWhooshSfx = t;
      ac();
      noise(0.11, 800, 3200, Math.min(0.28, 0.12 * spd), "bandpass");
    }
  },
  // Bomb detonation: heavy sub-bass drop + roaring rumble
  bomb: () => {
    ac();
    noise(0.9, 1400, 40, 0.75, "lowpass");
    tone(160, 0.8, "sawtooth", 0.45, 0.15);
    tone(75, 1.0, "sine", 0.6, 0.25);
  },
  // Missed fruit drop
  miss: () => {
    ac();
    tone(240, 0.28, "sawtooth", 0.16, 0.4);
    noise(0.15, 600, 150, 0.2, "lowpass");
  },
  // Power-up pickups
  power: (pw) => {
    ac();
    if (pw === "freeze") {
      [1200, 1000, 850, 600].forEach((f, i) => later(i * 70, () => tone(f, 0.22, "sine", 0.25, 0.8)));
      noise(0.5, 3000, 800, 0.25, "bandpass");
    } else if (pw === "frenzy") {
      [523, 659, 784, 1046, 1318].forEach((f, i) => later(i * 50, () => tone(f, 0.12, "triangle", 0.28)));
    } else if (pw === "life") {
      [392, 523, 659, 784, 1046].forEach((f, i) => later(i * 65, () => tone(f, 0.16, "triangle", 0.3)));
    } else {
      [659, 880, 1175, 1396].forEach((f, i) => later(i * 60, () => tone(f, 0.14, "triangle", 0.28)));
    }
  },
  // Combo celebrations
  combo: n => {
    ac();
    const base = 587 * Math.pow(1.12, Math.min(n, 8));
    [0, 4, 7, 12].forEach((s, i) => later(i * 55, () => tone(base * Math.pow(2, s / 12), 0.18, "triangle", 0.25)));
  },
  // Fruit launch pop
  launch: () => {
    const t = performance.now();
    if (t - lastLaunchSfx > 100) {
      lastLaunchSfx = t;
      ac();
      tone(220, 0.08, "sine", 0.18, 2.2);
      noise(0.09, 300, 1200, 0.12, "bandpass");
    }
  },
  // Game start / mode select
  start: () => {
    ac();
    [261, 329, 392, 523].forEach((f, i) => later(i * 75, () => tone(f, 0.18, "triangle", 0.3)));
  },
  // Game over
  over: () => {
    ac();
    [392, 349, 311, 261].forEach((f, i) => later(i * 140, () => tone(f, 0.32, "triangle", 0.28, 0.85)));
  },
  // Dodge & Duck: wall safely cleared
  pass: n => {
    ac();
    noise(0.18, 400, 3500, 0.25, "bandpass");
    tone(587 + Math.min(n, 12) * 45, 0.14, "triangle", 0.28, 1.4);
  },
  // Dodge & Duck: wall impact slam
  hit: () => {
    ac();
    noise(0.5, 1600, 60, 0.7, "lowpass");
    tone(130, 0.5, "sawtooth", 0.4, 0.25);
    tone(60, 0.6, "sine", 0.5, 0.3);
  },
  // Dodge & Duck: obstacle warning radar ping
  warn: () => {
    ac();
    tone(440, 0.1, "sine", 0.22, 1.4);
    later(110, () => tone(660, 0.08, "sine", 0.18, 1.4));
  },
  // Countdown tick
  tick: () => {
    ac();
    tone(980, 0.06, "sine", 0.2);
  },
};

/* ---------- game state ---------- */
const G = {
  mode: "menu", game: null, input: null, clock: 0, t: 0, score: 0, lives: 3, spawnT: 1,
  objs: [], queue: [], pieces: [], parts: [], splats: [], texts: [], targets: [],
  shake: 0, flash: 0, flashColor: "#fff", timeScale: 1, powers: {}, frenzyT: 0,
  combo: { n: 0, t: -9, x: 0, y: 0 }, sliced: 0, bestCombo: 0, lastPose: -9,
  // dodge & duck
  walls: [], body: null, bodyT: -9, base: null, calib: null, streak: 0, bestStreak: 0, passed: 0,
};

/* ---------- blades (hands / pointer) ---------- */
const mkBlade = color => ({ color, pts: [], x: 0, y: 0, has: false, lastSeen: -1e9, prev: null });
const blades = [mkBlade("#5ad1c4"), mkBlade("#ff8a3d"), mkBlade("#ffffff")];
const SLICE_SPEED = () => 60 * U; // px per second

function moveBlade(b, x, y, now) {
  if (!b.has || now - b.lastSeen > 300) { b.pts = []; b.prev = null; b.x = x; b.y = y; }
  else { b.x += (x - b.x) * .75; b.y += (y - b.y) * .75; }
  b.has = true; b.lastSeen = now;
  b.pts.push({ x: b.x, y: b.y, t: now });
  if (b.prev) {
    const dt = Math.max(1, now - b.prev.t), len = Math.hypot(b.x - b.prev.x, b.y - b.prev.y);
    const spd = len / dt * 1000;
    if (spd > SLICE_SPEED()) {
      trySlice(b.prev.x, b.prev.y, b.x, b.y);
      sfx.whoosh(spd / SLICE_SPEED());
    }
  }
  b.prev = { x: b.x, y: b.y, t: now };
}
function segDist(px, py, ax, ay, bx, by) {
  const dx = bx - ax, dy = by - ay, l2 = dx * dx + dy * dy || 1;
  const t = clamp(((px - ax) * dx + (py - ay) * dy) / l2, 0, 1);
  return Math.hypot(ax + dx * t - px, ay + dy * t - py);
}
function trySlice(ax, ay, bx, by) {
  const ang = Math.atan2(by - ay, bx - ax);
  for (const m of G.targets)
    if (G.clock - m.born > .4 && segDist(m.x, m.y, ax, ay, bx, by) < m.r) return cutTarget(m, ang);
  if (G.mode !== "play" || G.game !== "fruit") return;
  for (const o of G.objs) {
    if (o.dead) continue;
    if (segDist(o.x, o.y, ax, ay, bx, by) < o.r * (o.kind === "bomb" ? .7 : 1)) slice(o, ang);
  }
}

/* ---------- effects ---------- */
function burst(x, y, c, n, power = 1, type = "drop") {
  for (let i = 0; i < n; i++) {
    const a = rand(0, Math.PI * 2), sp = rand(15, 55) * U * power;
    G.parts.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 10 * U, c, type,
      size: rand(.5, 1.5) * U * (type === "smoke" ? 4 : 1), life: rand(.4, .8) * (type === "smoke" ? 1.6 : 1), max: 1,
      gf: type === "smoke" ? -.08 : type === "spark" ? .4 : 1 });
    G.parts[G.parts.length - 1].max = G.parts[G.parts.length - 1].life;
  }
}
function splat(x, y, c, r) {
  const blobs = Array.from({ length: 7 }, () => ({ dx: rand(-1, 1) * r, dy: rand(-1, 1) * r, r: rand(.2, .6) * r }));
  G.splats.push({ x, y, c, blobs, life: 3 });
  if (G.splats.length > 25) G.splats.shift();
}
function addText(x, y, s, c, size, life = 1) {
  G.texts.push({ x: clamp(x, 18 * U, W - 18 * U), y: clamp(y, 14 * U, H - 8 * U), s, c, size, life, max: life });
}
function halves(o, ang) {
  const nx = -Math.sin(ang), ny = Math.cos(ang), sp = 16 * U;
  for (const side of [-1, 1]) G.pieces.push({
    e: o.def.e, c: o.def.c, x: o.x, y: o.y, r: o.r, rot: o.rot, clip: ang - o.rot, side,
    vx: o.vx * .6 + nx * sp * side, vy: o.vy * .4 + ny * sp * side - 6 * U, vr: o.vr + side * rand(1.5, 3.5),
  });
}

/* ---------- fruit slash: slicing ---------- */
function slice(o, ang) {
  o.dead = true;
  if (o.kind === "bomb") return explode(o);
  if (o.kind === "power") return activate(o);
  halves(o, ang); burst(o.x, o.y, o.def.c, 16); splat(o.x, o.y, o.def.c, o.r);
  if (o.gold) burst(o.x, o.y, "#ffd166", 18, 1.4, "spark");
  if (G.clock - G.combo.t >= .4) finalizeCombo();
  G.combo.n++; G.combo.t = G.clock; G.combo.x = o.x; G.combo.y = o.y;
  const pts = (o.gold ? 5 : 1) * (G.powers.double ? 2 : 1);
  G.score += pts; G.sliced++;
  addText(o.x, o.y - o.r, "+" + pts, o.gold ? "#ffd166" : "#ffffff", o.gold ? 5 : 3.2, .7);
  sfx.slice(G.combo.n);
  G.shake = Math.max(G.shake, .5 * U);
  updateHud();
}
function finalizeCombo() {
  const n = G.combo.n; G.combo.n = 0;
  if (n < 3 || G.mode !== "play") return;
  const bonus = n * (G.powers.double ? 2 : 1);
  G.score += bonus; G.bestCombo = Math.max(G.bestCombo, n);
  addText(G.combo.x, G.combo.y - 4 * U, `${n} FRUIT COMBO`, "#ffd166", 5.2, 1.3);
  addText(G.combo.x, G.combo.y + 3 * U, `+${bonus}`, "#ffd166", 4, 1.3);
  sfx.combo(n); G.shake = Math.max(G.shake, 1.5 * U);
  updateHud();
}
function explode(o) {
  G.lives--; G.flash = 1; G.flashColor = "#ffffff"; G.shake = 4 * U; G.combo.n = 0;
  burst(o.x, o.y, "#ffb347", 36, 2, "spark"); burst(o.x, o.y, "#ff5d3d", 20, 1.6, "spark");

/* ---------- fruit slash: spawning ---------- */
function launch(q) {

  } else { def = pick(FRUITS); gold = Math.random() < .04; }

/* ---------- dodge & duck ---------- */

const WALLS = {

  leanL: { label: "⬅ LEAN",  c: "#5ad1c4", from: 0 },
  leanR: { label: "LEAN ➡",  c: "#5ad1c4", from: 0 },
  jump:  { label: "JUMP!",   c: "#ff3b5c", from: 10 },
  duckL: { label: "DUCK ⬅",  c: "#c3a6ff", from: 35 },
  duckR: { label: "DUCK ➡",  c: "#c3a6ff", from: 35 },

function startGame(id) {

    combo: { n: 0, t: -9, x: 0, y: 0 }, sliced: 0, bestCombo: 0, timeScale: 1, targets: [],

/* ---------- HUD ---------- */
function updateHud() {

  $("bestHud").textContent = "BEST " + Math.max(getBest(), G.mode === "play" ? 0 : G.score);
  let s = ""; for (let i = 0; i < Math.max(3, G.lives); i++) s += i < G.lives ? "❤️" : "🖤";

}

  $("powers").innerHTML = Object.entries(G.powers).map(([k, left]) => {
    const P = POWERS[k];
    return `<div class="pw">${P.e} ${P.label}<i><b style="width:${clamp(left / P.dur, 0, 1) * 100}%;background:${P.c}"></b></i></div>`;

let hintText = "";
function setHint(s) { if (s !== hintText) { hintText = s; $("hint").textContent = s; } }

/* ---------- update ---------- */

    if (G.combo.n && G.clock - G.combo.t >= .4) finalizeCombo();

        c: Math.random() < .5 ? "#ffd166" : "#ff8a3d", type: "spark", size: rand(.3, .6) * U, life: .25, max: .25, gf: .3 });
    }
    if (!o.dead && ((o.vy > 0 && o.y - o.r > H) || o.x < -4 * o.r || o.x > W + 4 * o.r)) {

  for (const t of G.texts) { t.life -= rdt; t.y -= 5 * U * rdt; }

  G.shake = Math.max(0, G.shake - G.shake * 7 * rdt - .02 * U);

  else if (dodgePaused && G.mode === "play") setHint("Paused: step back so your head and shoulders are in view");
  else if (cam && G.clock - G.lastPose > 1.5) setHint("Step back so your upper body and arms are in view");
  else if (G.targets.length) setHint(cam ? "Swing a hand through a game to pick it" : "Swipe fast across a game to pick it (or press 1, 2, 3)");

    ctx.font = `${(5 + 3 * Math.min(p, 1)) * U}px Bungee, ${EMOJI_FONT}`; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.lineWidth = .9 * U; ctx.strokeStyle = "rgba(0,0,0,.7)"; ctx.lineJoin = "round";
    ctx.strokeText(W_.label, W / 2, H * .16); ctx.fillStyle = W_.c; ctx.fillText(W_.label, W / 2, H * .16);
  }
}
function drawBody() {
  if (!G.body || G.clock - G.bodyT > .5) return;
  const [n, a, b] = G.body;
  const next = G.walls.find(w => !w.judged && w.age / w.T > .75);
  const c = next && !bodyClear(next) ? "#ff3b5c" : "#5ad1c4";
  const sw = Math.hypot(a.x - b.x, a.y - b.y);
  ctx.globalCompositeOperation = "lighter";
  glow(n.x, n.y, Math.max(3 * U, sw * .45), c, .5);
  ctx.globalCompositeOperation = "source-over";
  ctx.strokeStyle = c; ctx.lineWidth = 1 * U; ctx.lineCap = "round";
  ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
  for (const p of G.body) { ctx.fillStyle = "#ffffff"; ctx.beginPath(); ctx.arc(p.x, p.y, 1 * U, 0, Math.PI * 2); ctx.fill(); }
  if (G.mode === "calib" && G.calib) {
    const k = clamp(G.calib.t / 2, 0, 1), r = Math.max(5 * U, sw * .5);
    ctx.strokeStyle = "#ffd166"; ctx.lineWidth = .8 * U;
    ctx.beginPath(); ctx.arc(n.x, n.y, r, -Math.PI / 2, -Math.PI / 2 + k * Math.PI * 2); ctx.stroke();
    ctx.font = `${6 * U}px Bungee, sans-serif`; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillStyle = "#ffd166";
    ctx.fillText(Math.max(1, Math.ceil(2 - G.calib.t)), W / 2, H * .18);
  }
}
function draw(now) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalCompositeOperation = "source-over"; ctx.globalAlpha = 1;

  // background
  if (G.input === "camera" && video.readyState >= 2 && video.videoWidth) {
    const vw = video.videoWidth, vh = video.videoHeight, s = Math.max(W / vw, H / vh);
    VID = { dw: vw * s, dh: vh * s, ox: (W - vw * s) / 2, oy: (H - vh * s) / 2 };
    ctx.save(); ctx.translate(W, 0); ctx.scale(-1, 1);
    ctx.drawImage(video, VID.ox, VID.oy, VID.dw, VID.dh); ctx.restore();
    ctx.fillStyle = "rgba(12,10,20,.5)"; ctx.fillRect(0, 0, W, H);
  } else {
    const bg = ctx.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, "#1d1730"); bg.addColorStop(1, "#0d0b14");
    ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
  }
  ctx.fillStyle = vignette; ctx.fillRect(0, 0, W, H);
  if (G.timeScale < .95) { ctx.fillStyle = `rgba(120,200,255,${(1 - G.timeScale) * .3})`; ctx.fillRect(0, 0, W, H); }
  if (G.powers.double) { ctx.fillStyle = "rgba(255,209,102,.06)"; ctx.fillRect(0, 0, W, H); }

  ctx.save();
  if (G.shake > 0) ctx.translate(rand(-1, 1) * G.shake, rand(-1, 1) * G.shake);

  if (G.game === "dodge" && G.mode !== "menu") { drawWalls(); drawBody(); }

  // splats
  for (const s of G.splats) {
    ctx.globalAlpha = Math.min(1, s.life) * .5; ctx.fillStyle = s.c;
    for (const b of s.blobs) { ctx.beginPath(); ctx.arc(s.x + b.dx, s.y + b.dy, b.r, 0, Math.PI * 2); ctx.fill(); }
  }
  ctx.globalAlpha = 1;

  for (const m of G.targets) drawTarget(m);

  // flying objects
  for (const o of G.objs) {
    if (o.kind === "bomb") glow(o.x, o.y, o.r * 1.7, "#ff2d2d", .3 + .2 * Math.sin(G.clock * 12));
    else if (o.kind === "power") glow(o.x, o.y, o.r * 1.9, o.def.c, .55);
    else if (o.gold) glow(o.x, o.y, o.r * 1.8, "#ffd166", .6);
    ctx.save(); ctx.translate(o.x, o.y);
    if (o.kind === "power") {
      ctx.strokeStyle = o.def.c; ctx.lineWidth = .5 * U; ctx.setLineDash([1.5 * U, 1.2 * U]);
      ctx.rotate(G.clock * 3); ctx.beginPath(); ctx.arc(0, 0, o.r * 1.3, 0, Math.PI * 2); ctx.stroke();
      ctx.setLineDash([]); ctx.rotate(-G.clock * 3);
    }
    ctx.rotate(o.rot);
    if (o.gold) ctx.filter = "sepia(1) saturate(4) brightness(1.15)";
    drawSprite(o.def.e, o.r);
    ctx.filter = "none";
    ctx.restore();
  }

  // sliced halves
  for (const p of G.pieces) {
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.rotate(p.clip);
    ctx.beginPath(); ctx.rect(-p.r * 1.6, p.side < 0 ? -p.r * 1.6 : 0, p.r * 3.2, p.r * 1.6); ctx.clip();
    ctx.rotate(-p.clip); drawSprite(p.e, p.r); ctx.rotate(p.clip);
    ctx.fillStyle = p.c; ctx.globalAlpha = .9;
    ctx.beginPath(); ctx.ellipse(0, 0, p.r * .75, p.r * .14, 0, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  // particles
  for (const p of G.parts) {
    const a = clamp(p.life / p.max, 0, 1);
    ctx.globalCompositeOperation = p.type === "spark" ? "lighter" : "source-over";
    ctx.globalAlpha = p.type === "smoke" ? a * .35 : a;
    ctx.fillStyle = p.c; ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalCompositeOperation = "source-over"; ctx.globalAlpha = 1;

  // floating text
  ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.lineJoin = "round";
  for (const t of G.texts) {
    const age = t.max - t.life, k = Math.min(1, .4 + age * 7);
    ctx.globalAlpha = Math.min(1, t.life * 2.5);
    ctx.font = `${t.size * U * k}px Bungee, ${EMOJI_FONT}`;
    ctx.lineWidth = .9 * U; ctx.strokeStyle = "rgba(0,0,0,.7)"; ctx.strokeText(t.s, t.x, t.y);
    ctx.fillStyle = t.c; ctx.fillText(t.s, t.x, t.y);
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  // blades
  ctx.globalCompositeOperation = "lighter"; ctx.lineCap = "round";
  for (const b of blades) {
    b.pts = b.pts.filter(p => now - p.t < 170);
    const n = b.pts.length;
    for (let i = 1; i < n; i++) {
      const k = i / (n - 1), a = b.pts[i - 1], c = b.pts[i];
      ctx.globalAlpha = k; ctx.strokeStyle = b.color; ctx.lineWidth = k * 2.6 * U;
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(c.x, c.y); ctx.stroke();
      ctx.strokeStyle = "#ffffff"; ctx.lineWidth = k * .9 * U; ctx.stroke();
    }
    if (b !== blades[2] && b.has && now - b.lastSeen < 300) glow(b.x, b.y, 3.2 * U, b.color, .9);
  }
  ctx.globalCompositeOperation = "source-over"; ctx.globalAlpha = 1;

  if (G.flash > 0) { ctx.globalAlpha = G.flash * .6; ctx.fillStyle = G.flashColor; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
}

/* ---------- pose ---------- */
let landmarker = null, stream = null, lastVT = -1, autoPicked = false;
async function loadModel() {
  const { PoseLandmarker, FilesetResolver } = await import(VISION);
  const files = await FilesetResolver.forVisionTasks(WASM);
  const opts = d => ({ baseOptions: { modelAssetPath: MODEL, delegate: d }, runningMode: "VIDEO", numPoses: 1 });
  try { landmarker = await PoseLandmarker.createFromOptions(files, opts("GPU")); }
  catch { landmarker = await PoseLandmarker.createFromOptions(files, opts("CPU")); }
  $("status").textContent = "Pose model ready.";
}
loadModel().catch(e => { $("status").textContent = "Couldn't load the pose model — mouse mode still works. (" + e.message + ")"; });

/* 1-Euro Filter for jitter-free tracking */
class LowPassFilter {
  constructor(alpha = 0.5) { this.setAlpha(alpha); this.y = null; this.s = null; }
  setAlpha(alpha) { this.alpha = Math.max(0, Math.min(1, alpha)); }
  filter(val, alpha = this.alpha) {
    if (this.y === null) { this.s = val; this.y = val; return val; }
    this.y = alpha * val + (1 - alpha) * this.s;
    this.s = this.y;
    return this.y;
  }
  last() { return this.y; }
  reset() { this.y = null; this.s = null; }
}

class OneEuroFilter {
  constructor(freq = 60, minCutoff = 1.0, beta = 0.007, dCutoff = 1.0) {
    this.freq = freq; this.minCutoff = minCutoff; this.beta = beta; this.dCutoff = dCutoff;
    this.xFilter = new LowPassFilter();
    this.dxFilter = new LowPassFilter();
    this.lastTime = null;
  }
  alpha(cutoff, dt) {
    const tau = 1.0 / (2 * Math.PI * cutoff);
    return 1.0 / (1.0 + tau / dt);
  }
  filter(x, timestamp = performance.now() / 1000) {
    if (this.lastTime === null) { this.lastTime = timestamp; return this.xFilter.filter(x); }
    const dt = Math.max(timestamp - this.lastTime, 1e-4);
    this.lastTime = timestamp;
    const prevX = this.xFilter.last() ?? x;
    const dx = (x - prevX) / dt;
    const edx = this.dxFilter.filter(dx, this.alpha(this.dCutoff, dt));
    const cutoff = this.minCutoff + this.beta * Math.abs(edx);
    return this.xFilter.filter(x, this.alpha(cutoff, dt));
  }
  reset() { this.xFilter.reset(); this.dxFilter.reset(); this.lastTime = null; }
}

const euroFilters = [
  { x: new OneEuroFilter(60, 1.2, 0.015), y: new OneEuroFilter(60, 1.2, 0.015) },
  { x: new OneEuroFilter(60, 1.2, 0.015), y: new OneEuroFilter(60, 1.2, 0.015) },
];

function handlePose(lm, now) {
  if (!lm) return;
  G.lastPose = G.clock;
  const P = i => ({ x: W - (VID.ox + lm[i].x * VID.dw), y: VID.oy + lm[i].y * VID.dh, v: lm[i].visibility ?? 1 });
  for (const [w, ix, bi] of [[15, 19, 0], [16, 20, 1]]) {
    const a = P(w), b = P(ix);
    if (a.v < .4) continue;
    const rawX = a.x + (b.x - a.x) * 1.4, rawY = a.y + (b.y - a.y) * 1.4;
    const fx = euroFilters[bi].x.filter(rawX, now);
    const fy = euroFilters[bi].y.filter(rawY, now);
    moveBlade(blades[bi], fx, fy, now);
  }
  // nose and both shoulders for dodge & duck
  const pts = [P(0), P(11), P(12)];
  if (pts.every(p => p.v > .5)) {
    const fresh = G.body && G.clock - G.bodyT < .3;
    G.body = pts.map((p, i) => fresh ? { x: G.body[i].x + (p.x - G.body[i].x) * .6, y: G.body[i].y + (p.y - G.body[i].y) * .6 } : { x: p.x, y: p.y });
    G.bodyT = G.clock;
  }
}

/* ---------- camera ---------- */
async function startCamera(deviceId) {
  ac();
  if (stream) stream.getTracks().forEach(t => t.stop());
  const size = { width: { ideal: 1280 }, height: { ideal: 720 } };
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: deviceId ? { deviceId: { exact: deviceId }, ...size } : size, audio: false });
  } catch (e) {
    if (deviceId) return startCamera(); // a saved camera may be gone
    $("status").textContent = "Camera blocked or not found. Allow camera access in your browser and try again. (" + e.name + ")";
    return;
  }
  video.srcObject = stream; await video.play();
  const first = G.input !== "camera";
  G.input = "camera"; $("camBtn").textContent = "Restart camera";
  if (first && G.mode === "menu") showHub();
  const id = stream.getVideoTracks()[0].getSettings().deviceId;
  saveCam(id);
  await listCameras(id);
}
async function listCameras(currentId) {
  const cams = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === "videoinput");
  const sel = $("cam"); sel.innerHTML = "";
  cams.forEach((c, i) => {
    const o = document.createElement("option");
    o.value = c.deviceId; o.textContent = c.label || `Camera ${i + 1}`; o.selected = c.deviceId === currentId;
    sel.appendChild(o);
  });
  sel.hidden = cams.length < 2;
  if (!autoPicked) {
    autoPicked = true;
    const osmo = cams.find(c => /osmo|pocket/i.test(c.label));
    if (osmo && osmo.deviceId !== currentId) await startCamera(osmo.deviceId);
  }
}
$("camBtn").onclick = () => startCamera(G.input === "camera" ? undefined : savedCam() || undefined);
$("cam").onchange = e => startCamera(e.target.value);
$("mouseBtn").onclick = () => {
  ac();
  if (!G.input) { G.input = "mouse"; showHub(); }
};
addEventListener("pointerdown", e => {
  if (e.target.closest("button,select,a")) return;
  ac();
  const mx = e.clientX * DPR, my = e.clientY * DPR;
  if (G.mode === "menu" && G.targets.length) {
    for (const m of G.targets) {
      if (Math.hypot(mx - m.x, my - m.y) < m.r * 1.5) {
        cutTarget(m, -0.4);
        return;
      }
    }
  }
  if (G.mode === "play" && G.game === "fruit") {
    for (const o of G.objs) {
      if (!o.dead && Math.hypot(mx - o.x, my - o.y) < o.r * 1.2) {
        slice(o, 0);
      }
    }
  }
  moveBlade(blades[2], mx, my, performance.now());
});

addEventListener("pointermove", e => {
  if (!G.input) return;
  for (const ev of (e.getCoalescedEvents ? e.getCoalescedEvents() : [e]))
    moveBlade(blades[2], ev.clientX * DPR, ev.clientY * DPR, ev.timeStamp || performance.now());
  if (G.input === "mouse" && G.game === "dodge") setBodyFromMouse(e.clientX * DPR, e.clientY * DPR);
});
addEventListener("keydown", e => {
  if (!G.input) return;
  if (e.code === "Space" && G.targets.length) { e.preventDefault(); ac(); cutTarget(G.targets[0], -.4); }
  else if (e.code === "Escape" && G.mode !== "menu") showHub();
  else if (G.mode === "menu" && /^Digit[1-9]$/.test(e.code)) {
    const g = GAMES[+e.code.slice(5) - 1], m = g && G.targets.find(t => t.label === g.name);
    if (m) { ac(); cutTarget(m, -.4); }
  }
});

/* ---------- main loop ---------- */
let last = performance.now();
function frame(now) {
  const rdt = clamp((now - last) / 1000, 0, .05); last = now; G.clock += rdt;
  if (landmarker && G.input === "camera" && video.readyState >= 2 && video.currentTime !== lastVT) {
    lastVT = video.currentTime;
    try { handlePose(landmarker.detectForVideo(video, now).landmarks?.[0], now); } catch {}
  }
  G.timeScale += ((G.powers.freeze ? .4 : 1) - G.timeScale) * Math.min(1, rdt * 6);
  update(rdt * G.timeScale, rdt);
  draw(now);
  requestAnimationFrame(frame);
}
updateHud();
requestAnimationFrame(frame);
// ?debug exposes the game for testing from the browser console
if (new URLSearchParams(location.search).has("debug")) Object.assign(window, { G, frame, startGame, showHub, setBodyFromMouse, bodyClear });
</script>
</body>
</html>
